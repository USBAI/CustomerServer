<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Scraper</title>
</head>
<body>
    <button id="scrapeButton">Scrape and Save URLs</button>

    <script>
        document.getElementById('scrapeButton').addEventListener('click', async () => {
            async function scrapeAndSaveUrls() {
                const url = 'https://www.amazon.se/s?rh=n%3A20637719031&fs=true&ref=lp_20637719031_sar';

                try {
                    // Fetch the HTML content from the URL
                    const response = await fetch(url);
                    const html = await response.text();

                    // Parse the HTML content using DOMParser
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    // Get all href URLs from the specified anchor tags
                    const urlElements = doc.querySelectorAll('a.a-link-normal.s-no-outline');
                    const urls = Array.from(urlElements).map(a => a.href);

                    // Create the JSON data to be saved
                    const jsonData = JSON.stringify(urls, null, 2);

                    // Use the File System Access API to open and write to the JSON file
                    try {
                        // Open a file picker and allow the user to select the JSON file
                        const fileHandle = await window.showSaveFilePicker({
                            suggestedName: 'Get_Product_Urls.json',
                            types: [{
                                description: 'JSON Files',
                                accept: {'application/json': ['.json']},
                            }],
                            excludeAcceptAllOption: true,
                            multiple: false
                        });

                        // Create a writable stream and write the JSON data to the file
                        const writableStream = await fileHandle.createWritable();
                        await writableStream.write(jsonData);
                        await writableStream.close();

                        console.log('JSON data has been saved to', fileHandle.name);
                    } catch (err) {
                        console.error('Error:', err);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }

            scrapeAndSaveUrls();
        });
    </script>
</body>
</html>
